const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');let W=900,H=420,SX=14,SY=7.2;

try{G=JSON.parse(localStorage.getItem('rg_save'))}catch(e){}if(!G||!G.team)fresh();if(G&&G.po&&(!G.po.seed||G.po.seed.length<32))G.po=null;if(G&&G.wk>8&&!G.po){G.wk=1;G.w=0;G.l=0}

/* audio */
let ac;function cheer(){try{ac=ac||new AudioContext();const n=ac.sampleRate*1.6,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=900;const o=ac.createGain();o.gain.value=.5;s.connect(f).connect(o).connect(ac.destination);s.start()}catch(e){}}
function toast(m,add){const e=$('toast');e.textContent=add&&e.textContent?e.textContent+' · '+m:m;clearTimeout(tt);tt=setTimeout(()=>e.textContent='',add?3800:2200)}
/* menus */
const ui=h=>{$('ui').innerHTML=h;$('ui').className=''},hide=()=>{$('ui').className='hide';$('ln').style.display='none'};
const TEAMS=[{n:'NEW ENGLAND',a:'N.E',c:'#1a2a5a',h:'#c02828',s:70},{n:'MIAMI',a:'MIA',c:'#0aa0a0',h:'#f08020',s:68},{n:'BUFFALO',a:'BUF',c:'#2060d0',h:'#d03030',s:66},{n:'NEW YORK A',a:'NYA',c:'#208040',h:'#eeeeee',s:60},{n:'ATLANTA',a:'ATL',c:'#222222',h:'#d02020',s:64},{n:'DALLAS',a:'DAL',c:'#aab0c0',h:'#2040a0',s:72},{n:'GREEN BAY',a:'GB',c:'#1a5a30',h:'#e8c020',s:69},{n:'KANSAS CITY',a:'KC',c:'#d02020',h:'#e8c020',s:78},...'CLEVELAND:CLE,DENVER:DEN,HOUSTON:HOU,JACKSONVILLE:JAX,LAS VEGAS:LV,LOS ANGELES:LAR,L.A. CHARGERS:LAC,BALTIMORE:BAL,CINCINNATI:CIN,PITTSBURGH:PIT,TENNESSEE:TEN,INDIANAPOLIS:IND,CHICAGO:CHI,DETROIT:DET,MINNESOTA:MIN,PHILADELPHIA:PHI,WASHINGTON:WAS,NEW YORK G:NYG,CAROLINA:CAR,NEW ORLEANS:NO,TAMPA BAY:TB,ARIZONA:ARI,SEATTLE:SEA,SAN FRANCISCO:SF'.split(',').map((q,i)=>{const[n,a]=q.split(':');return{n,a,c:`hsl(${i*47%360},55%,32%)`,h:`hsl(${(i*47+170)%360},70%,52%)`,s:56+(i*37)%25}})];
const DIVS=['A EAST','A NORTH','A SOUTH','A WEST','B EAST','B NORTH','B SOUTH','B WEST'];
const TM=a=>TEAMS.find(t=>t.a==a),ME=()=>TEAMS[G.tm];
function mkP(s,o){return{slot:s,name:pk(FN)+'.'+pk(LN),ovr:o,sal:Math.max(1,Math.round((o-45)/4)),inj:0,sk:RI(0,3),hr:RI(0,3)}}
function fresh(){G={wk:1,yr:1,w:0,l:0,fans:100,cr:300,cap:100,morale:70,fac:{stadium:0,training:0,rehab:0,staff:0},picks:3,draft:true,last:null,hist:{},tm:-1,team:SL.map(s=>mkP(s,70))};genFA();genDr();genTr()}
function newOpp(){if(G.po)return;const o=G.sch[G.wk-1];G.opp={n:o.n,s:TM(o.n).s}}
function newSeason(){const me=G.tm,o=TEAMS.map((_,i)=>i).filter(i=>i!=me),dv=o.filter(i=>i>>2==me>>2),rest=o.filter(i=>i>>2!=me>>2).sort(()=>Math.random()-.5).slice(0,5),L=[...dv,...rest].sort(()=>Math.random()-.5);G.sch=L.map((i,k)=>({n:TEAMS[i].a,h:k%2==0}));G.st={};TEAMS.forEach(t=>G.st[t.a]=[0,0])}
function simLeague(){TEAMS.forEach((t,i)=>{if(i!=G.tm){G.st[t.a]=G.st[t.a]||[0,0];Math.random()<.3+(t.s-55)/80?G.st[t.a][0]++:G.st[t.a][1]++}})}
const SK=['#f0c0a0','#c68642','#8d5524','#5a3a22'],HR=['#222','#a52','#e0b040','#111'];
const face=(a,j)=>`<svg viewBox="0 0 16 16" width=70 height=70 shape-rendering=crispEdges><rect x=2 y=11 width=12 height=5 fill="${j}"/><rect x=5 y=4 width=6 height=7 fill="${SK[a.sk||0]}"/><rect x=5 y=3 width=6 height=2 fill="${HR[a.hr||0]}"/><rect x=6 y=7 width=1 height=1 /><rect x=9 y=7 width=1 height=1 /></svg>`;
const stars=(o,c)=>`<span class=st style="--p:${cl((o-40)/55*100,0,100)}%;--c:${c||'#fd0'}">★★★★★</span>`;
const smile=m=>`<i class=sm style="background:${m>70?'#fd0':m>50?'#f90':m>30?'#e22':'#3af'}"></i>`,co=n=>`${n}<i class=co></i>`;
const bx=(t,i,c)=>`<div class="bx ${c||''}"><span class=bl>${t}</span>${i}</div>`;
const mean=ix=>ix.reduce((s,i)=>s+eo(G.team,i),0)/ix.length;
const hdr=(t,r,b)=>`<div class=top><div class=pill>${co(G.cr)}</div><div class=ttl><span class=ss>★</span>★<span class=sb>★</span> ${t} <span class=sb>★</span>★<span class=ss>★</span></div><div class=pill>${r||'&nbsp;'}</div></div>`+(b?`<button class=x onclick="${b}">✕</button>`:'');
const capb=()=>bx(`SALARY CAP ${used()}M / ${G.cap}M`,`<div class=bar><i style="width:${Math.min(100,used()/G.cap*100)}%"></i></div>`,'cap');
const card=(a,o={})=>{const u=a.slot=='DEF'||a.slot=='OL'?'#f33':a.slot=='K'?'#e8660e':'#5bc0f8';return `<div class=w><div class="cd ${o.f?'clk':''}" ${o.f?`onclick="${o.f}"`:''}><div class=ph style="background:${a.inj?'#888':u}"><b>${a.slot}</b>${smile(G.morale)}${face(a,ME().c)}</div><div class=nm>${a.name.split('.')[1]}${stars(a.ovr)}${a.pts>0?'<div>⬆ UPGRADE</div>':''}${o.s?`<div>$${a.sal}M</div>`:''}</div><div class=en><i style="width:${a.inj?0:cl(a.ovr,10,100)}%"></i></div></div>${o.c?`<div class=pill>${o.c}</div>`:''}</div>`};
function pick0(){ui(`<div class=ttl>SELECT YOUR TEAM</div><div class=r>Stronger teams have better players. Pick wisely!</div><div class=grid>`+TEAMS.map((t,i)=>`<div class=w><div class="cd clk" onclick="pickTeam(${i})"><div class=ph style="background:${t.h}">${face({sk:i%4,hr:i%4},t.c)}</div><div class=nm>${t.n}${stars(t.s+10)}<div>${t.a} &middot; ${DIVS[i>>2]}</div></div></div></div>`).join('')+'</div>')}

const fp=Math.round(cl(G.fans/2,0,100)),tips=['STRONG PLAYERS WIN GAMES!','TRADE DRAFT PICKS FOR STARS','KEEP MORALE HIGH TO AVOID FUMBLES','WIND AFFECTS FIELD GOALS'];
ui(hdr('RETRO GRIDIRON','Y'+G.yr)+`<div class=band>${nd}</div><div class=row>`+bx('CONF '+DIVS[G.tm>>2],`<table style="width:100%"><tr><td><td>W<td>L<td>T</tr>${dv.map(d=>`<tr class="${d.t.a==me.a?'me':''}"><td>${d.t.n}<td>${d.w}<td>${d.l}<td>0</tr>`).join('')}</table>`,'half')+`<div class="half col">`+bx('FANS '+fp+'%',`<div class=bar><i style="width:${fp}%"></i></div>`)+`<div class=row>`+bx('MORALE',`${G.morale}% ${smile(G.morale)}`)+bx('OFFENSE',stars(mean([0,1,2,3,4,5]),'#5bc0f8'))+bx('DEFENSE',stars(mean([5,6,7]),'#f33'))+`</div></div></div><div class=r>TIP! ${pk(tips)}</div>
<div class=nav><button onclick=settings()>⚙ NEW TEAM</button><button onclick=fo()>FRONT OFFICE</button><button onclick=roster()>ROSTER</button><button onclick=dif()>LEVEL: ${DF().n}</button><button onclick=sstat()>STATS</button><button onclick="start(1)">2 PLAYER</button><button onclick="start(0)">CONTINUE ▶</button></div>`)}
let askF=null;
window.alert=m=>{const d=$('al');d.textContent=m;d.style.display='block';clearTimeout(d.t);d.t=setTimeout(()=>d.style.display='none',2500)};

const POS={QB:['QUARTERBACK','THROW ACCURACY','ARM STRENGTH','SPEED'],WR:['WIDE RECEIVER','CATCHING','SPEED','AGILITY'],RB:['RUNNING BACK','RUSHING','SPEED','STRENGTH'],OL:['OFFENSIVE LINE','BLOCKING','STRENGTH','AWARENESS'],DEF:['DEFENSE','TACKLING','COVERAGE','SPEED'],K:['KICKER','KICK ACCURACY','KICK POWER','COMPOSURE']};
const hs=(s,k)=>{let h=k;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
function ens(a){if(a.at)return a;const h=k=>hs(a.name,k),at=[1,2,3].map(k=>cl(a.ovr+(h(k+2)%21)-10,25,95));at.push(cl(70+h(9)%30,50,100));
a.at=at;a.mx=at.map((v,i)=>Math.max(v,cl(v+10+h(i+30)%25,60,96)));const best=a.ovr>=86?2:a.ovr>=78?1:0;[0,1,2,3].sort((x,y)=>h(x+20)%7-h(y+20)%7).slice(0,best).forEach(i=>a.mx[i]=100);
a.lv=Math.max(1,Math.floor((a.ovr-45)/8));a.xp=h(4)%60;a.pts=0;return a}
function upg(i,k){const a=ens(G.team[i]);if(a.pts<1||a.at[k]>=a.mx[k])return;a.at[k]=Math.min(a.mx[k],a.at[k]+5);a.pts--;a.ovr=Math.min(99,a.ovr+1);a.sal=Math.max(1,Math.round((a.ovr-45)/4));save();pl(i)}
function gainXP(win){const up=[];G.team.forEach(a=>{ens(a);a.xp+=win?60:35;while(a.xp>=60+a.lv*30){a.xp-=60+a.lv*30;a.lv++;a.pts++;up.push(a.name)}});return `<div class=r>+${win?60:35} XP for every player${up.length?'<br>⬆ LEVEL UP: '+up.join(', ')+'<br>Open their card to upgrade an attribute!':''}</div>`}
function pl(i){const a=ens(G.team[i]),P=POS[a.slot],h=hs(a.name,1),age=a.age||21+h%12,pot=Math.min(99,a.ovr+Math.floor(a.mx.reduce((t,m,k)=>t+Math.max(0,m-a.at[k]),0)/5)),lv=a.lv,mo=G.morale>70?'GREAT':G.morale>50?'GOOD':G.morale>30?'BAD':'TERRIBLE';

h+=gainXP(win);G.wk++;if(G.wk>8)h+=startPO();newOpp();genFA();genTr();save()}
ui(h+'<button onclick="menu()">CONTINUE</button>');p=null;g=null}
/* update */
const mv=(o,tx,ty,s)=>{const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);if(d<=s){o.x=tx;o.y=ty;return true}o.x+=dx/d*s;o.y+=dy/d*s;return false};
const defs=()=>[...p.rush,...p.cov,p.saf];
function upd(dt){if(!g||!p||!['live','ball','run'].includes(p.st))return;p.t+=dt;const D=eo(p.d,6),Dt=A(p.d,6,0),hd=g.poss==0&&!g.p2?DF():{sp:1,rd:0},dsp=5.4*(.85+A(p.d,6,2)/300)*dt*hd.sp*FZ(p.d,6);
if(p.st=='run'){if(p.t>p.hd){const c=p.car,oc=eo(p.o,c.i==4?4:c.i),ol=(A(p.o,5,0)+A(p.o,5,1))/2,sd=A(p.o,c.i,c.i==0?2:1),bk=c.i==0?eo(p.o,0):A(p.o,c.i,2),fz=FZ(p.o,c.i);let nd=null,nm=99;for(const e of defs()){const d=Math.hypot(e.x-c.x,e.y-c.y);if(e.x>c.x-1&&d<nm){nm=d;nd=e}}
const ky=keys.d-keys.u;if(ky)c.y+=ky*9*dt;else if(nd&&nm<5)c.y=cl(c.y+(c.y>nd.y?1:-1)*1.6*dt,2,51);c.x+=(p.scr?5.8:p.kind=='run'?6.4:7.4)*(.85+sd/300)*fz*dt*(c.inv>0?.5:1);
if(c.x>=100)return endPlay(100-p.los,{td:1});if(c.y<1||c.y>52)return endPlay(Math.round(c.x-p.los),{oob:1,msg:'OUT OF BOUNDS!'});
const rate=cl(4.5-oc/30+(Dt-ol)/40,1.2,5)*(g.poss==0&&!g.p2?(p.kind=='run'?1+(DF().tk-1)*.3:DF().tk):1)*(p.scr?(c.x<p.los-.5?.2:1):p.kind=='run'?(c.x<p.los-.5?.15:c.x<p.los+5?.35:.3):1);
if(c.inv>0)c.inv-=dt;
const R2=p.kind=='run'?1.9:1.4,nc=defs().filter(e=>Math.hypot(e.x-c.x,e.y-c.y)<R2).length;
if(!(c.inv>0)&&nc&&Math.random()<dt*rate*(p.kind=='run'?1+.25*(nc-1):nc)){if(p.kind=='run'&&Math.random()>cl(.72+(Dt-bk)/150,.4,.95)){c.inv=.45}else{if(g.poss==0&&G.morale<40&&Math.random()<.1)return endPlay(Math.round(c.x-p.los),{to:1,msg:'FUMBLE!'});return endPlay(Math.round(c.x-p.los))}}}
else if(c=p.car){c.x=Math.max(c.x-3*dt,p.los-8)}
if(p.t>p.hd||p.car.i!=4)for(const e of defs()){const db=e===p.saf||p.cov.includes(e);mv(e,p.car.x+Math.min(3,Math.hypot(e.x-p.car.x,e.y-p.car.y)*.25),p.car.y,dsp*(p.kind=='pass'?(db?1.22:1.08):p.kind=='run'?1.2:(p.car.i==4?1:1.05)))}
else for(const e of p.rush)mv(e,p.car.x,p.car.y,dsp*.9);return}
/* passing */
const sp=r=>6.4*(.8+A(p.o,r.i,1)/250)*dt*FZ(p.o,r.i),rt=ROUTES[g.set];let ch=null;if(p.st=='ball'){let m0=12;for(const r of p.rec){const d=Math.hypot(r.x-p.b.tx,r.y-p.b.ty);if(d<m0){m0=d;ch=r}}}
p.rec.forEach((r,j)=>{if(r===ch){mv(r,p.b.tx,p.b.ty,sp(r)*1.2);return}if(r.k<rt[j].length){const[dx,dy]=rt[j][r.k];if(mv(r,r.sx+dx,r.sy+dy,sp(r)))r.k++}else if(j<3&&rt[j][rt[j].length-1][0]>=18)r.x=Math.min(109,r.x+sp(r)*.95)});
if(p.st=='live'){p.qb.x=Math.max(p.los-7,p.qb.x-4*dt);const dl=cl(2.6-hd.rd+(A(p.d,6,2)-A(p.o,5,0))/-25+(A(p.o,5,2)-70)/60,1,4.5);
for(const e of p.rush){if(p.t>dl)mv(e,p.qb.x,p.qb.y,5.5*dt*hd.sp);if(Math.hypot(e.x-p.qb.x,e.y-p.qb.y)<.9){return endPlay(-RI(4,9),{msg:'SACKED!'})}}}
else for(const e of p.rush)mv(e,p.qb.x,p.qb.y,2*dt);
p.cov.forEach(c=>{const r=p.wr[c.t];if(p.st=='ball'&&Math.hypot(c.x-p.b.tx,c.y-p.b.ty)<9)mv(c,p.b.tx,p.b.ty,dsp*1.15);else mv(c,r.x+1.3,r.y,dsp)});
const far=p.wr.reduce((a,b)=>b.x>a.x?b:a);if(p.st=='ball'&&Math.hypot(p.saf.x-p.b.tx,p.saf.y-p.b.ty)<12)mv(p.saf,p.b.tx,p.b.ty,dsp*1.15);else mv(p.saf,far.x+4,far.y,dsp*.9);
if(p.st=='ball'){const b=p.b;b.t+=dt;if(b.t>=b.T)resolve()}}
function throwTo(tx,ty){if(!p||p.st!='live')return;if(tx<p.qb.x-.5){p.scr=true;p.kind='run';p.car=p.qb;p.hd=0;p.st='run';toast('QB KEEPS IT!');bar();return}const _s=S();if(_s)_s.att++;const arm=A(p.o,0,1),mR=18+arm*.45;let d=Math.hypot(tx-p.qb.x,ty-p.qb.y);if(d>mR){const f=mR/d;tx=p.qb.x+(tx-p.qb.x)*f;ty=p.qb.y+(ty-p.qb.y)*f;d=mR;toast('WEAK ARM: THROW FALLS SHORT!')}const q0=A(p.o,0,0),pr=p.rush.some(e=>Math.hypot(e.x-p.qb.x,e.y-p.qb.y)<3.5)?1:0,sc=(100-q0)/100*.08*d+pr*1.3+(g.wea=='RAIN'?.6:0)+Math.abs(g.wind)*.05+Math.max(0,d-mR*.7)*.05;tx+=(Math.random()+Math.random()-1)*sc*2;ty+=(Math.random()+Math.random()-1)*sc*1.4;p.b={x0:p.qb.x,y0:p.qb.y,tx,ty,t:0,T:Math.max(.35,d/(12+arm*.14))};p.st='ball';bar()}
function resolve(){const b=p.b;if(b.ty<.5||b.ty>52.5||b.tx>=110)return endPlay(0,{inc:1,msg:'THROWN OUT OF BOUNDS'});let rec=null,m=2.4;for(const r of p.rec){const d=Math.hypot(r.x-b.tx,r.y-b.ty);if(d<m){m=d;rec=r}}
let dm=99;for(const e of p.cov.concat([p.saf]))dm=Math.min(dm,Math.hypot(e.x-b.tx,e.y-b.ty));const ik=g.poss==0&&!g.p2?DF().ik:1,po=()=>endPlay(Math.round(b.tx-p.los),{to:1,msg:'INTERCEPTED! PICKED OFF!'});
if(!rec){if(dm<4&&Math.random()<(.3+A(p.d,6,1)/400)*ik)return po();return endPlay(0,{inc:1,msg:'INCOMPLETE'})}
const q=A(p.o,0,0),re=rec.i==4?eo(p.o,4):A(p.o,rec.i,0),wx=g.wea=='RAIN'?.05:g.wea=='SNOW'?.07:0;
if(dm<1.6&&Math.random()<(.1+A(p.d,6,1)/450+(dm<.9?.12:0)-q/700)*ik){rec.x=b.tx;return po()}
let pr=.42+re/220+q/330-(dm<1.5?.28:dm<3?.1:0)-wx-Math.abs(g.wind)*.004;
if(m<1.2&&dm>=1.5)pr=Math.max(pr,.93);if(Math.random()<pr){rec.x=b.tx;rec.y=b.ty;p.car=rec;p.st='run';p.hd=0;bar();if(rec.x>=100)return endPlay(100-p.los,{td:1});toast('COMPLETE!')}
else endPlay(0,{inc:1,msg:'INCOMPLETE'})}
const keys={u:0,d:0};
addEventListener('keydown',e=>{if(e.code=='ArrowUp'){keys.u=1;e.preventDefault()}if(e.code=='ArrowDown'){keys.d=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.code=='ArrowUp')keys.u=0;if(e.code=='ArrowDown')keys.d=0});
/* input */
function pt(e){const r=cv.getBoundingClientRect();return[cam+((e.clientX-r.left)*W/r.width-W/2)/SX,((e.clientY-r.top)*H/r.height-24)/SY]}
cv.addEventListener('pointerdown',e=>{if(p&&p.st=='live'){p.aim=pt(e);cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(p&&p.aim)p.aim=pt(e)});
cv.addEventListener('pointerup',e=>{if(p&&p.aim){const a=pt(e);p.aim=null;throwTo(a[0],a[1])}});
addEventListener('keydown',e=>{if(e.code=='Space'&&p&&p.st=='pre'&&g.down<4){e.preventDefault();snap()}});
/* draw */
const sxp=v=>W/2+(v-cam)*SX,syp=v=>24+v*SY;
function man(o,c,star,ring){const k=Math.max(1,SY/7.2),X=Math.round(sxp(o.x)),Y=Math.round(syp(o.y));x.save();x.translate(X,Y);x.scale(k,k);x.fillStyle='#0006';x.fillRect(-4,4,9,3);x.fillStyle=c.j;x.fillRect(-4,-5,8,10);x.fillStyle=c.h;x.fillRect(-4,-8,8,4);x.fillStyle='#000';x.fillRect(-4,-8,8,1);if(star){x.fillStyle='#ffd700';x.fillRect(-2,-14,4,4)}if(ring){x.strokeStyle='#6af';x.lineWidth=2;x.beginPath();x.arc(0,0,11,0,7);x.stroke()}x.restore()}
function draw(){x.clearRect(0,0,W,H);x.imageSmoothingEnabled=false;if(!g||!p)return;
const foc=p.st=='run'||p.st=='ball'?(p.car?p.car.x:p.b?p.b.tx:p.los):p.st=='live'?p.los:p.los+6;cam+=(cl(foc,24,76)-cam)*.12;
x.fillStyle='#222';x.fillRect(0,0,W,24);for(let i=0;i<W;i+=6)for(let j=0;j<3;j++){x.fillStyle=['#e44','#fc4','#4ae','#eee','#c84'][(i*7+j*13+(i>>4))%5];x.fillRect(i,j*8+2,4,4)}
for(let y=-10;y<110;y+=5){x.fillStyle=y<0?TC[0].h:y>=100?TC[1].h:((y/5)&1?'#3f7a38':'#376f31');x.fillRect(sxp(y),24,5*SX+1,53*SY)}
x.fillStyle='#fff8';for(let y=0;y<=100;y+=5)x.fillRect(sxp(y)-1,24,2,53*SY);
for(let y=1;y<100;y++){x.fillRect(sxp(y),24,1,5);x.fillRect(sxp(y),24+53*SY-5,1,5)}
x.font='20px "Press Start 2P",monospace';x.fillStyle='#fff7';x.textAlign='center';for(let y=10;y<=90;y+=10){x.fillText(Math.min(y,100-y),sxp(y),24+14*SY);x.fillText(Math.min(y,100-y),sxp(y),24+46*SY)}
x.fillStyle='#fff';x.fillRect(0,24,W,2);x.fillRect(0,24+53*SY-2,W,2);x.fillStyle='#4af';x.fillRect(sxp(p.los)-1,24,3,53*SY);x.fillStyle='#fd0';const fd=Math.min(100,p.los+g.togo);x.fillRect(sxp(fd)-1,24,3,53*SY);
x.fillStyle='#2a5a28';x.fillRect(0,24+53*SY,W,H);for(let i=0;i<5;i++){x.fillStyle='#f70';x.fillRect(((i*220-cam*SX)%W+W)%W,H-10,10,8)}
if(p.st=='pre'){const rt=ROUTES[g.set];x.strokeStyle='#3d3';x.lineWidth=3;p.rec.forEach((r,j)=>{x.beginPath();x.moveTo(sxp(r.x),syp(r.y));let px=r.sx,py=r.sy;rt[j].forEach(([dx,dy])=>{px=r.sx+dx;py=r.sy+dy;x.lineTo(sxp(px),syp(py))});x.stroke();x.fillStyle='#3d3';x.fillRect(sxp(px)-3,syp(py)-3,6,6)})}
const O=TC[g.poss],Dc=TC[1-g.poss];defs().forEach(e=>man(e,Dc));p.ol.forEach(o=>man(o,O));p.rec.forEach(r=>man(r,O,r.i<4,p.car==r));
if(p.st!='run'||p.car===p.qb)man(p.qb,O,1,p.car===p.qb);
if(p.st=='ball'){const b=p.b,f=b.t/b.T,bx=b.x0+(b.tx-b.x0)*f,by=b.y0+(b.ty-b.y0)*f;x.fillStyle='#000';x.fillRect(sxp(bx)-3,syp(by)-Math.sin(Math.PI*f)*40-2,7,5);x.fillStyle='#a52';x.fillRect(sxp(bx)-2,syp(by)-Math.sin(Math.PI*f)*40-2,5,4)}
if(p.aim){x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(sxp(p.aim[0]),syp(p.aim[1]),12,0,7);x.stroke();x.fillStyle='#fff';x.fillRect(sxp(p.aim[0])-2,syp(p.aim[1])-2,4,4)}
if(g.wea!='CLEAR'){if(g.wea=='RAIN'){x.fillStyle='#0a1a3a44';x.fillRect(0,0,W,H)}g.pts.forEach(q=>{q.y+=q.v*(g.wea=='RAIN'?3:.6);q.x+=g.wind*.4+(g.wea=='SNOW'?Math.sin(q.y/20):0);if(q.y>H){q.y=0;q.x=R(0,W)}if(q.x<0)q.x+=W;if(q.x>W)q.x-=W;x.fillStyle=g.wea=='RAIN'?'#9cf':'#fff';g.wea=='RAIN'?x.fillRect(q.x,q.y,1,8):x.fillRect(q.x,q.y,3,3)})}
x.fillStyle='#fff';x.textAlign='left';x.font='10px "Press Start 2P",monospace';x.fillText(g.names[g.poss]+' BALL',8,H-6)}
function hud(){if(!g)return;const o=n=>['th','st','nd','rd','th'][n==1?1:n==2?2:n==3?3:4];const m=Math.floor(g.clock/60),s=String(Math.floor(g.clock%60)).padStart(2,'0');
const dn=p?g.down+({1:'st',2:'nd',3:'rd',4:'th'}[g.down])+' & '+(g.ball+g.togo>=100?'Goal':g.togo):'';
$('hud').innerHTML=`<span>${g.names[0]} ${g.score[0]} ${g.names[1]} ${g.score[1]}</span><span>Q${g.q} ${m}:${s}</span><span>${dn}</span>`;
$('info').textContent=`${g.wea} | WIND ${g.wind>0?'→':'←'} ${Math.abs(g.wind)} mph (affects kicks & passes) | Ball on ${g.ball<=50?'own '+g.ball:'opp '+(100-g.ball)} | TIMEOUTS ${g.to[0]}-${g.to[1]} | Morale ${G.morale} | ${DF().n}`}
let lt=0;function loop(t){const dt=Math.min(.05,(t-lt)/1000);lt=t;resize();if(kk){kk.t+=dt;const m=$('mk');if(m)m.style.left=(Math.sin(kk.t*kk.sp)+1)/2*100+'%'}upd(dt);draw();hud();requestAnimationFrame(loop)}
